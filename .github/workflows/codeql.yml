name: CodeQL + Docker CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  analyze:
    name: Analyze (${{ matrix.language}})
    # Use ubuntu-latest for the analysis job
    runs-on: ubuntu-latest
    # Define permissions for the job
    permissions:
      # required for all workflows
      security-events: write
      packages: read
      actions: read
      contents: read
    # Define language to be analyzed
    
  strategy:
    name: CodeQL Analysis
    fail-fast: false
    matrix:
      include:
      - language: actions
        build-mode: none
      - language: go
        build-mode: autobuild

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.build-mode }}

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
      with:
        category: "/language:${{matrix.language}}"

  docker:
    name: Docker Build & Run
    runs-on: ubuntu-latest
    needs: analyze

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t go-web-server .

      - name: Run Docker
        run: docker run -p 8080:8080 -it --rm go-web-server

    # Define steps to build and run the Docker container
